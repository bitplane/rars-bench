[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rars-bench"
version = "0.0.1"
description = "Compression-quality and performance harness for rars vs reference RAR."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "WTFPL" }
authors = [{ name = "Gareth Davidson", email = "gaz@bitplane.net" }]
classifiers = [
    "License :: Public Domain",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
]

[project.scripts]
rars-bench = "rars_bench.harness:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: end-to-end tests requiring dosbox-x and reference binaries",
]
